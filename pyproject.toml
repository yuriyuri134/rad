[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "openlab-bench-optics"
version = "0.2.0"
description = "OpenLab Bench scientific computing bridge for Optiland optical design, Astropy FITS/WCS, Photutils & SEP star extraction, and 3D Monte Carlo tolerancing"
readme = "README_LOCAL.md"
requires-python = ">=3.11"
dependencies = [
  "optiland>=0.6.3",
  "numpy>=2.0.0",
  "scipy>=1.14.0",
  "astropy>=7.0.0",
  "sep>=1.4.0",
  "photutils>=2.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
]

