[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "openlab-bench-optics"
version = "0.1.0"
description = "OpenLab Bench local Python scientific computing bridge for Optiland optical simulation and optimization"
readme = "README_LOCAL.md"
requires-python = ">=3.11"
dependencies = [
  "optiland>=0.5.8",
  "numpy>=1.26.0",
  "scipy>=1.12.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
]
